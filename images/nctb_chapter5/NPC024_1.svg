<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%"> <rect width="640" height="360" fill="#0f172a" rx="12" stroke="#334155" stroke-width="2"/> <g transform="translate(0, 10)"> <text x="320" y="40" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">প্রোগ্রাম ফ্লোচার্ট ডায়াগ্রাম (Flowchart Structure)</text> <ellipse cx="320" cy="80" rx="55" ry="22" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/> <text x="320" y="85" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">START</text> <path d="M 320,102 L 320,130" stroke="#38bdf8" stroke-width="3"/> <polygon points="260,130 390,130 370,165 240,165" fill="#1e293b" stroke="#818cf8" stroke-width="3"/> <text x="315" y="152" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Input A, B</text> <path d="M 315,165 L 315,195" stroke="#38bdf8" stroke-width="3"/> <rect x="240" y="195" width="150" height="38" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/> <text x="315" y="219" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Sum = A + B</text> <path d="M 315,233 L 315,260" stroke="#38bdf8" stroke-width="3"/> <ellipse cx="315" cy="282" rx="55" ry="22" fill="#1e293b" stroke="#818cf8" stroke-width="3"/> <text x="315" y="287" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">STOP</text> </g> </svg>