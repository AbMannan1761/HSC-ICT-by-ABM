<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%"> <rect width="640" height="360" fill="#0f172a" rx="12" stroke="#334155" stroke-width="2"/> <g transform="translate(0, 15)"> <text x="320" y="35" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle">কৃত্রিম বুদ্ধিমত্তা (Artificial Intelligence - AI)</text> <!-- Neural Network Nodes --> <g fill="#1e293b" stroke="#38bdf8" stroke-width="3"> <!-- Layer 1 --> <circle cx="200" cy="110" r="16"/> <circle cx="200" cy="175" r="16"/> <circle cx="200" cy="240" r="16"/> <!-- Layer 2 --> <circle cx="320" cy="140" r="18" fill="#818cf8"/> <circle cx="320" cy="210" r="18" fill="#818cf8"/> <!-- Layer 3 --> <circle cx="440" cy="175" r="20" fill="#f59e0b"/> <!-- Synapses --> <line x1="216" y1="110" x2="302" y2="140" stroke="#38bdf8" stroke-width="2"/> <line x1="216" y1="175" x2="302" y2="140" stroke="#38bdf8" stroke-width="2"/> <line x1="216" y1="240" x2="302" y2="210" stroke="#38bdf8" stroke-width="2"/> <line x1="338" y1="140" x2="420" y2="175" stroke="#f59e0b" stroke-width="2.5"/> <line x1="338" y1="210" x2="420" y2="175" stroke="#f59e0b" stroke-width="2.5"/> </g> <text x="320" y="295" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle">আর্টিফিশিয়াল নিউরাল নেটওয়ার্ক ও ডিসিশন মেকিং</text> </g> </svg>